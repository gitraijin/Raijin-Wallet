plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.raijin'
version = '0.1.0'

android {
  namespace "expo.modules.raijinscan"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

// CameraX 1.6.0 needs the real ListenableFuture (see expo-camera's build.gradle).
configurations.configureEach {
  resolutionStrategy.force "com.google.guava:listenablefuture:1.0"
}

// QR codes are decoded on the device with ZXing (Apache-2.0, plain Java, no network).
// It replaces Google ML Kit, which also pulls in Google Play services and telemetry.
dependencies {
  def camerax_version = "1.6.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation "com.google.zxing:core:3.5.3"
}
