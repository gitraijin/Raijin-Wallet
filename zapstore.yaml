name: Raijin Wallet
summary: A Lightning wallet for the node you run (LND, Nostr Wallet Connect or LNDHub).
description: |
  Raijin Wallet connects to the node you run and puts it in your pocket.
  No custodian. No middleman. No permission needed.

  - Connect your own node: **LND**, **Nostr Wallet Connect** or **LNDHub**
  - Lightning, on-chain and Cashu ecash in one place
  - Built-in Tor, PIN, biometrics and a duress wallet
  - Two looks: the terminal style and the calmer Fujin style, plus many themes
  - Nine languages: English, German, Spanish, French, Italian, Portuguese, Japanese, Chinese, Russian

  Raijin Wallet is beta software. Start with small amounts.
